<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}"/>
<head>
    <title>Artisteja</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

<h1>Labels</h1>
<div class="col-md-4" style="padding:20px 0">
		<span sec:authentication="name">Name</span>
	</div>
	<div class="col-md-4" style="padding:20px 0">
	 	<form th:action="@{/logout}" method="post">
			<input type="submit" value="Sign out" class="btn btn-sm btn-danger"/>
	 	</form>
	 </div>
<table class="table table-striped">
    <tr>
        <th>Name</th>
        <th>Artists</th>
        <th sec:authorize="hasAuthority('ADMIN')">Functions</th>
    </tr>
    <tr th:each="label : ${labels}">
        <td th:text="${label.name}"></td>
        <td>
            <span th:each="artist : ${label.signed}" th:text="${artist.name + ' | '}"></span>
            </td>
        <td sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/editLabel/{id}(id=${label.labelid})}" class="btn btn-secondary">Edit</a>
            <a th:href="@{/deleteLabel/{id}(id=${label.labelid})}" class="btn btn-danger">Delete</a></td>
    </tr>
</table>
<div sec:authorize="hasAuthority('ADMIN')"> <a th:href="@{/addLabel}" class="btn btn-success">Add Label</a></div>
<a th:href="@{/artistList}" class="btn btn-secondary">Artists</a>
</body>
