<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Artisteja</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
	<h1>Artist information</h1>
	<div>
		<form action="#" th:object="${artist}" th:action="@{/saveArtist}" method="post">
		  	<label for="artistName">Name</label>
			<input type="text" id="artistName" th:field="*{name}" />
			<div style="clear: both; display: block; height: 10px;"></div>
			
		  	<label for="country">Country</label>
			<input  type="text" id="country" th:field="*{country}" />
			<div style="clear: both; display: block; height: 10px;"></div>

            <label for="founded">Founded</label>
			<input type="number" id="founded" th:field="*{founded}" step="1"/>
			<div style="clear: both; display: block; height: 10px;"></div>

			<label for="genreList">Genre</label>
				<select id="genreList" th:field="*{genre}" class="form-control">
					<option th:each="genre: ${genres}" th:value="${genre.genreid}" th:text="${genre.name}"></option>
				</select>
			<div style="clear: both; display: block; height: 10px;"></div>

			<div th:each="label : ${labels}">
				<input type="checkbox" name="labelIds" th:value="${label.labelid}"/>
				<span th:text="${label.name}"></span>
			</div>
			<div style="clear: both; display: block; height: 10px;"></div>

			<input type="submit" value="Save artist"/>
		</form>
	</div>
	</div>
	</div>
</div>
	</body>
</html>
