<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Artisteja</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
	<div class="container mt-4">
		<div class="row justify-content-center">
			<div class="col-md-6">
	<h1>Artist information</h1>
	<div>
		<form th:object="${artist}" th:action="@{../saveArtist}" action="#" method="post">

			<label for="id"></label>
			<input type="hidden" id="id" th:field="*{id}"/>
			<div style="clear: both; display: block; height: 10px;"></div>

		  	<label for="name">Name</label>
			<input type="text" th:value="${artist.name}" id="name" th:field="*{name}" />
			<div style="clear: both; display: block; height: 10px;"></div>

		  	<label for="country">Country</label>
			<input type="text" th:value="${artist.country}" id="country" th:field="*{country}" />
			<div style="clear: both; display: block; height: 10px;"></div>

            <label for="founded">Founded</label>
			<input type="number" th:value="${artist.founded}" id="founded" th:field="*{founded}" step="1"/>
			<div style="clear: both; display: block; height: 10px;"></div>

			<label for="genre">Genre</label>
				<select id="genre" th:field="*{genre}" class="form-control">
					<option th:each="genre: ${genres}" th:value="${genre.genreid}" th:field="*{genre}" th:text="${genre.name}"></option>
				</select>

			<div th:each="label : ${labels}">
				<input type="checkbox" name="labelIds" th:value="${label.labelid}"/>
				<span th:text="${label.name}"></span>
			</div>
			<div style="clear: both; display: block; height: 10px;"></div>

			<p><input type="submit" value="Save"></input></p>
		</form>
	</div>
	</div>
	</div>
</div>
	</body>
</html>
